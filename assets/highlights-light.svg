<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" role="img" aria-label="Highlights"><title>Highlights</title><defs><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards}@keyframes grow{from{transform:scaleX(0)}}.ringp{animation:fill 1.6s .4s cubic-bezier(.2,.8,.2,1) backwards}@keyframes fill{from{stroke-dashoffset:289.0}}</style><linearGradient id="g-intel" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#0894FF"/><stop offset="0.33" stop-color="#C959DD"/><stop offset="0.67" stop-color="#FF2E54"/><stop offset="1.00" stop-color="#FF9004"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#0A84FF"/><stop offset="1.00" stop-color="#5E5CE6"/></linearGradient><linearGradient id="g-sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#FF6B00"/><stop offset="1.00" stop-color="#FF2D55"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#00B37E"/><stop offset="1.00" stop-color="#0A84FF"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#AF52DE"/><stop offset="1.00" stop-color="#FF2D55"/></linearGradient><linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#FF9500"/><stop offset="1.00" stop-color="#FF3B30"/></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#30B0C7"/><stop offset="1.00" stop-color="#5E5CE6"/></linearGradient></defs><rect x="0.0" y="0.0" width="592.0" height="340" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="32.0" y="45.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">CI/CD  ·  MEC NETWORKS</text><text class="s" x="30.0" y="128.4" font-size="88" font-weight="700" fill="url(#g-blue)" text-anchor="start" letter-spacing="-2">10 → 4 min</text><text class="s" x="32.0" y="308.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">70% less manual effort.</text><text class="s" x="32.0" y="283.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">Deploy time after I rebuilt CI/CD across three codebases, with</text><text class="s" x="32.0" y="185.0" font-size="14" font-weight="500" fill="#6E6E73" text-anchor="start" letter-spacing="0">Before</text><rect class="bar" style="animation-delay:0.3s" x="124" y="174" width="400" height="12" rx="6" fill="#E3E3E8"/><text class="s" x="536.0" y="185.0" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start" letter-spacing="0">10 min</text><text class="s" x="32.0" y="219.0" font-size="14" font-weight="500" fill="#6E6E73" text-anchor="start" letter-spacing="0">After</text><rect class="bar" style="animation-delay:0.8s" x="124" y="208" width="160" height="12" rx="6" fill="url(#g-blue)"/><text class="s" x="296.0" y="219.0" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start" letter-spacing="0">4 min</text><rect x="608.0" y="0.0" width="392.0" height="340" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="640.0" y="45.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">RELIABILITY</text><text class="s" x="638.0" y="115.6" font-size="72" font-weight="700" fill="url(#g-sunset)" text-anchor="start" letter-spacing="-2">−90%</text><text class="s" x="640.0" y="308.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">Compose.</text><text class="s" x="640.0" y="283.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">pipelines with GitHub Actions and Docker</text><text class="s" x="640.0" y="258.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">fewer build failures after automating</text><circle cx="916" cy="84" r="46" fill="none" stroke="#E3E3E8" stroke-width="14"/><circle cx="916" cy="84" r="46" fill="none" stroke="url(#g-sunset)" stroke-width="14" stroke-linecap="round" stroke-dasharray="289.0" stroke-dashoffset="28.9" transform="rotate(-90 916 84)" class="ringp"/><rect x="0.0" y="356.0" width="322.7" height="260" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="32.0" y="401.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">BUZZMAP</text><text class="s" x="30.0" y="460.4" font-size="58" font-weight="700" fill="url(#g-mint)" text-anchor="start" letter-spacing="-2">380+</text><text class="s" x="32.0" y="584.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">risk across 142 barangays.</text><text class="s" x="32.0" y="559.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">active users reporting dengue</text><rect x="338.7" y="356.0" width="322.7" height="260" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="370.7" y="401.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">KABIS</text><text class="s" x="368.7" y="460.4" font-size="58" font-weight="700" fill="url(#g-violet)" text-anchor="start" letter-spacing="-2">110 → 1</text><text class="s" x="370.7" y="584.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">write.</text><text class="s" x="370.7" y="559.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">collapsed into one batched</text><text class="s" x="370.7" y="534.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">per-row database queries</text><rect x="677.3" y="356.0" width="322.7" height="260" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="709.3" y="401.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">DALAGO</text><text class="s" x="707.3" y="460.4" font-size="58" font-weight="700" fill="url(#g-gold)" text-anchor="start" letter-spacing="-2">−86%</text><text class="s" x="709.3" y="584.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">down to 1.27MB.</text><text class="s" x="709.3" y="559.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">mobile asset size, from 9.25MB</text><rect x="0.0" y="632.0" width="322.7" height="240" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="32.0" y="677.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">STREAMS</text><text class="s" x="30.0" y="736.4" font-size="58" font-weight="700" fill="url(#g-teal)" text-anchor="start" letter-spacing="-2">~190</text><text class="s" x="32.0" y="840.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">types and 3 clients.</text><text class="s" x="32.0" y="815.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">API endpoints across 12 role</text><rect x="338.7" y="632.0" width="322.7" height="240" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="370.7" y="677.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">QUADSHIELD</text><text class="s" x="368.7" y="736.4" font-size="58" font-weight="700" fill="url(#g-intel)" text-anchor="start" letter-spacing="-2">&lt;1s</text><text class="s" x="370.7" y="840.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">between citizens and police.</text><text class="s" x="370.7" y="815.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">two-way emergency voice</text><rect x="677.3" y="632.0" width="322.7" height="240" rx="28" fill="#F5F5F7" stroke="#E3E3E8"/><text class="s" x="709.3" y="677.0" font-size="14" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0.2">NU MANILA</text><text class="s" x="707.3" y="736.4" font-size="58" font-weight="700" fill="url(#g-blue)" text-anchor="start" letter-spacing="-2">3.78</text><text class="s" x="709.3" y="840.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">Laude, BS IT.</text><text class="s" x="709.3" y="815.0" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">GWA. Graduated Magna Cum</text></svg>